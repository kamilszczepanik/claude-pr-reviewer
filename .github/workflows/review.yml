name: Claude PR review

on:
  workflow_call:
    inputs:
      model:
        type: string
        default: claude-sonnet-5-5
      max-comments:
        type: number
        default: 15
      max-diff-bytes:
        type: number
        default: 150000
      max-budget-usd:
        description: Hard cost cap of one review in USD; the run is skipped, not failed, when it is reached
        type: number
        default: 2
      pr-number:
        description: Pull request number for a manual rerun from workflow_dispatch
        type: string
        default: ''
      gateway-model:
        description: Model id on the AI Gateway fallback route
        type: string
        default: anthropic/claude-sonnet-5.5
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      AI_GATEWAY_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  review:
    permissions:
      contents: read
      pull-requests: write
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false && github.event.pull_request.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pr-number }}
      cancel-in-progress: false
    steps:
      - name: Resolve pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr-number }}
        run: |
          case "$PR_NUMBER" in
            '' | *[!0-9]*)
              echo "Numer PR musi być liczbą"
              exit 1
              ;;
          esac
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '[(.head.repo.full_name // ""), .head.sha] | @tsv')
          head_repo=$(printf '%s' "$pr" | cut -f1)
          head_sha=$(printf '%s' "$pr" | cut -f2)
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head-sha=$head_sha" >> "$GITHUB_OUTPUT"
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "Przegląd Claude pominięty: PR z forka nie dostaje sekretów"
            echo "fork=true" >> "$GITHUB_OUTPUT"
          else
            echo "fork=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out pull request head
        if: steps.pr.outputs.fork == 'false'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ steps.pr.outputs.head-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        if: steps.pr.outputs.fork == 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22

      - name: Review with Claude
        if: steps.pr.outputs.fork == 'false'
        uses: kamilszczepanik/claude-pr-reviewer@cf3ac11c327d686c3484b5d022c6e62479dd4bf3  # v1.4.1
        with:
          model: ${{ inputs.model }}
          max-comments: ${{ inputs.max-comments }}
          max-diff-bytes: ${{ inputs.max-diff-bytes }}
          max-budget-usd: ${{ inputs.max-budget-usd }}
          pr-number: ${{ steps.pr.outputs.number }}
          head-sha: ${{ steps.pr.outputs.head-sha }}
          repo-dir: ${{ github.workspace }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          ai-gateway-api-key: ${{ secrets.AI_GATEWAY_API_KEY }}
          gateway-model: ${{ inputs.gateway-model }}
          github-token: ${{ github.token }}
