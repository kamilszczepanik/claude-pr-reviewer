name: Claude review

on:
  pull_request:
    types: [opened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR number to review again
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number || inputs.pr-number }}
  cancel-in-progress: false

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      pull-requests: write
    uses: kamilszczepanik/claude-pr-reviewer/.github/workflows/review.yml@da68017f50d4be602b7cfedb652b48063a775a30
    with:
      pr-number: ${{ inputs.pr-number }}
    secrets:
      ANTHROPIC_API_KEY: ${{ vars.CLAUDE_REVIEW_ROUTE == 'asystent' && secrets.ANTHROPIC_API_KEY_ASYSTENT || ((vars.CLAUDE_REVIEW_ROUTE == 'individual' || vars.CLAUDE_REVIEW_ROUTE == '') && secrets.ANTHROPIC_API_KEY) || '' }}
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
