name: Claude PR reviewer
description: Reviews a pull request with Claude through the Agent SDK and posts one review with inline comments
inputs:
  model:
    description: Claude model id
    required: true
  max-comments:
    description: Upper bound on inline comments
    required: true
  max-diff-bytes:
    description: Diff size sent to the model, cut at file boundaries
    required: true
  max-budget-usd:
    description: Hard cost cap of one review in USD
    required: false
    default: '2'
  pr-number:
    description: Pull request number
    required: true
  head-sha:
    description: Commit the review is anchored to
    required: true
  repo-dir:
    description: Checkout of the pull request head
    required: true
  anthropic-api-key:
    description: Anthropic API key
    required: false
    default: ''
  ai-gateway-api-key:
    description: Vercel AI Gateway key, used when the Anthropic API credit or usage limit is exhausted
    required: false
    default: ''
  gateway-model:
    description: Model id on the AI Gateway route
    required: false
    default: anthropic/claude-sonnet-5.5
  github-token:
    description: Token with pull-requests write
    required: true
runs:
  using: composite
  steps:
    - name: Install reviewer
      shell: bash
      run: npm ci --prefix "$GITHUB_ACTION_PATH" --no-audit --no-fund --loglevel=error
    - name: Review
      shell: bash
      env:
        REVIEW_MODEL: ${{ inputs.model }}
        MAX_COMMENTS: ${{ inputs.max-comments }}
        MAX_DIFF_BYTES: ${{ inputs.max-diff-bytes }}
        MAX_BUDGET_USD: ${{ inputs.max-budget-usd }}
        PR_NUMBER: ${{ inputs.pr-number }}
        HEAD_SHA: ${{ inputs.head-sha }}
        REPO_DIR: ${{ inputs.repo-dir }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        AI_GATEWAY_API_KEY: ${{ inputs.ai-gateway-api-key }}
        GATEWAY_MODEL: ${{ inputs.gateway-model }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: node "$GITHUB_ACTION_PATH/scripts/review.mjs"
